function trait(id){return Number(hero?.traits?.[id]||0)}
function gearStat(stat){return Object.values(hero.equip).reduce((sum,i)=>sum+(Number(i?.[stat])||0),0)}
function magicFind(){return trait('fortune')*.016+trait('plunder')*.02+gearStat('find')}
function lifeSteal(){return trait('siphon')*.02+gearStat('leech')}
function attackHaste(){return Math.min(.58,trait('frenzy')*.07+gearStat('haste'))}
function itemWorth(item){return Math.max(5,Math.round((item.level+4)*(rarities.indexOf(item.rarity)+1)**1.7*2))}
function dyeFor(type,rarity){let d={common:['#5e5341','#574e46','#515b51'],magic:['#425c79','#466569','#4c577f'],rare:['#947448','#887649','#7f6553'],epic:['#745185','#694d89','#73537d'],legendary:['#925431','#a46b3a','#8e644b']};return d[rarity][rand(0,2)]}
function rollAffix(affix,depth,tier){let v=affix.scale*(1+depth*.18+Math.max(0,tier)*.23)*(0.75+Math.random()*.65);return affix.percent?Math.round(v*1000)/1000:Math.max(1,Math.round(v))}
function effectLabel(i){return i?.effect?uniqueRelics.find(x=>x.effect===i.effect&&x.type===i.type)?.subtitle||i.subtitle||'Unique relic ability':''}
function gearTags(i){let tags=[];for(let a of affixPool){let v=i?.[a.key]||0;if(v>0)tags.push(`${a.percent?'+': '+'}${a.percent?Math.round(v*1000)/10+'%':Math.round(v)} ${a.stat}`)}return tags}

function freshHero(kind){let s=specs[kind];return {kind,level:1,xp:0,gold:0,floor:1,health:s.hp,mana:s.mp,equip:{weapon:null,armor:null,charm:null},bag:[],traits:{strength:0,guard:0,fortune:0},points:0,kills:0,best:1,potions:4,auto:false};}
function maxHp(){return specs[hero.kind].hp+(hero.level-1)*16+trait('guard')*20+trait('vitality')*25+gearStat('hp')}
function maxMp(){return specs[hero.kind].mp+(hero.level-1)*6}
function attackPower(){return specs[hero.kind].atk+(hero.level-1)*3+trait('strength')*5+trait('fury')*4+gearStat('atk')}
function defence(){return 2+trait('guard')*2+trait('resilience')*2+gearStat('def')}
function critical(){return Math.min(.7,.07+trait('fortune')*.025+trait('precision')*.03+gearStat('crit'))}
function xpRequired(){return 38+hero.level*24+Math.round(hero.level*hero.level*1.8)}
function store(){try{localStorage.setItem('hollowDepths_save_v1',JSON.stringify(hero))}catch(e){}}
function restore(){try{let s=JSON.parse(localStorage.getItem('hollowDepths_save_v1'));if(s&&specs[s.kind]){let h=freshHero(s.kind);hero={...h,...s,equip:{...h.equip,...(s.equip||{})},traits:{...h.traits,...(s.traits||{})},bag:Array.isArray(s.bag)?s.bag:[],health:Math.max(1,s.health||h.health)};hero.auto=false;return true}}catch(e){}return false}

function generateItem(depth,boss=false){
 let u=Math.random()+Math.min(.07,magicFind()*.17)+(boss?.12:0)+Math.min(.035,depth*.0008);
 let rarity=u>.983?'legendary':u>.89?'epic':u>.69?'rare':u>.38?'magic':'common',tier=rarities.indexOf(rarity);

 let v=(3+depth*1.25)*(1+tier*.55),item={id:Date.now()+'-'+Math.random().toString(36).slice(2),name:base,rarity,type,
    atk:type==='weapon'?Math.round(v*1.5):type==='charm'?Math.round(v*.55):0,
    def:type==='armor'?Math.round(v*.85):0,hp:type==='armor'?Math.round(v*2):0,
    crit:0,level:depth,tint:dyeFor(type,rarity),affixes:[]};

   let uniques=uniqueRelics.filter(r=>r.type===type),u=uniques[rand(0,uniques.length-1)],m=1+depth*.11;

   for(let [k,value] of Object.entries(u.stats))item[k]=Math.round(value*m*(value<1?1000:1))/(value<1?1000:1);
   item.affixes=['UNIQUE RELIC'];return item;
 }
 let affixCount= [0,1,2,3,4][tier],pool=affixPool.filter(a=>!a.for||a.for.includes(type));
 for(let n=0;n<affixCount;n++){if(!pool.length)break;let j=rand(0,pool.length-1),a=pool.splice(j,1)[0],rolled=rollAffix(a,depth,tier);item[a.key]=(item[a.key]||0)+rolled;item.affixes.push(a.name)}
 let labels=['Weathered','Enchanted','Rare','Exalted','Legendary'];
 item.name=(tier>=2?item.affixes[0]+' ':'')+labels[tier]+' '+base+(tier>=3?' of '+item.affixes[item.affixes.length-1]:'');
 return item;
}
function lootDrop(x,y,boss=false){let item=generateItem(hero.floor,boss);game.drops.push({x,y,item,phase:Math.random()*6});floating.push({x,y,text:'✦ '+item.rarity.toUpperCase(),t:1.8,color:rarityColor(item.rarity)});if(item.rarity==='legendary')show('✦ UNIQUE RELIC! '+item.name,3500)}
function rarityColor(r){return ({common:'#c9d0d7',magic:'#72baff',rare:'#f8cf70',epic:'#d7a2ff',legendary:'#ffa265'})[r]}
function createFloor(){if(!hero)return;let n=21,tiles=Array.from({length:n},()=>Array(n).fill(1)),rooms=[];for(let attempts=0;attempts<95&&rooms.length<rand(7,10);attempts++){let w=rand(3,6),h=rand(3,6),x=rand(1,n-w-2),y=rand(1,n-h-2);if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;rooms.push({x,y,w,h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2)});for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)tiles[j][i]=0}
 if(rooms.length<3){createFloor();return}for(let t=1;t<rooms.length;t++){let a=rooms[t-1],b=rooms[t];let cx=a.cx,cy=a.cy;const path=(x,y)=>{if(x>0&&x<n-1&&y>0&&y<n-1)tiles[y][x]=0};if(Math.random()<.5){while(cx!==b.cx){path(cx,cy);cx+=Math.sign(b.cx-cx)}while(cy!==b.cy){path(cx,cy);cy+=Math.sign(b.cy-cy)}}else{while(cy!==b.cy){path(cx,cy);cy+=Math.sign(b.cy-cy)}while(cx!==b.cx){path(cx,cy);cx+=Math.sign(b.cx-cx)}}path(b.cx,b.cy)}
 let start=rooms[0],far=rooms.reduce((a,b)=>dist(b,start)>dist(a,start)?b:a,rooms[1]);let free=[];for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++)if(!tiles[y][x])free.push({x,y});let enemies=[],count=clamp(6+hero.floor*2,7,25);for(let i=0;i<count;i++){let pos=free[rand(0,free.length-1)];if(dist(pos,start)<4||dist(pos,far)<1.5)continue;let isBoss=hero.floor%5===0&&i===count-1;let baseHp=22+hero.floor*11+hero.level*6;enemies.push({x:pos.x+.5,y:pos.y+.5,hp:baseHp*(isBoss?5:1),maxhp:baseHp*(isBoss?5:1),atk:5+hero.floor*1.7,spd:isBoss?.65:rand(7,14)/10,cd:rand(0,100)/100,type:isBoss?'BOSS':['WRAITH','SLIME','SKELETON','BAT','REVENANT','CULTIST'][rand(0,5)],boss:isBoss,elite:!isBoss&&hero.floor>=2&&Math.random()<.10,phase:rand(0,40)/10});}
 for(let e of enemies)if(e.elite){e.hp*=2.4;e.maxhp*=2.4;e.atk*=1.45;e.spd*=1.08}
 game={n,tiles,rooms,enemies,drops:[],port:{x:far.cx+.5,y:far.cy+.5},player:{x:start.cx+.5,y:start.cy+.5},theme:themes[(hero.floor-1)%themes.length],cleared:false,shake:0,swings:[],time:0,fog:Array.from({length:n},()=>Array(n).fill(false))};for(let t=0;t<5;t++)reveal();$('floorTag').textContent='☩ '+game.theme.toUpperCase();updateHud();}
function reveal(){if(!game)return;let {player:p,n,fog}=game;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(Math.hypot(x+.5-p.x,y+.5-p.y)<5.0)fog[y][x]=true}
function wall(x,y){return !game||x<0||y<0||y>=game.n||x>=game.n||game.tiles[Math.floor(y)][Math.floor(x)]===1}
function move(o,dx,dy,dt){let x=o.x+dx*dt,y=o.y+dy*dt,r=.18; if(!wall(x-r,o.y-r)&&!wall(x+r,o.y-r)&&!wall(x-r,o.y+r)&&!wall(x+r,o.y+r))o.x=x;if(!wall(o.x-r,y-r)&&!wall(o.x+r,y-r)&&!wall(o.x-r,y+r)&&!wall(o.x+r,y+r))o.y=y}
function visibleBetween(a,b){let n=Math.ceil(dist(a,b)*5);for(let i=1;i<n;i++){let u=i/n;if(wall(a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u))return false}return true}
function nearest(range=99,lineOnly=false){let m=null,d=range;for(const e of game.enemies){if(e.hp<=0)continue;let z=dist(e,game.player);if(z<d&&(!lineOnly||visibleBetween(game.player,e))){d=z;m=e}}return m}
function nextPath(from,to){let s={x:Math.floor(from.x),y:Math.floor(from.y)},g={x:Math.floor(to.x),y:Math.floor(to.y)};if(s.x===g.x&&s.y===g.y)return to;let n=game.n,queue=[s],seen=new Set([s.y*n+s.x]),parent=new Map(),end=-1;for(let k=0;k<queue.length;k++){let q=queue[k],id=q.y*n+q.x;if(q.x===g.x&&q.y===g.y){end=id;break}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=q.x+dx,y=q.y+dy,key=y*n+x;if(!wall(x,y)&&!seen.has(key)){seen.add(key);parent.set(key,id);queue.push({x,y})}}}if(end<0)return to;let start=s.y*n+s.x;while(parent.has(end)&&parent.get(end)!==start)end=parent.get(end);return {x:(end%n)+.5,y:Math.floor(end/n)+.5}}
function navigate(dest,speed,dt,stop=.3){let p=game.player,d=dist(dest,p);if(d<stop)return;let step=visibleBetween(p,dest)?dest:nextPath(p,dest),dd=dist(step,p);if(dd>.04)move(p,(step.x-p.x)/dd*speed,(step.y-p.y)/dd*speed,dt)}
function hitEnemy(e,mult=1){
 if(!e||e.hp<=0)return;
 let crit=Math.random()<critical(),execute=(e.hp/e.maxhp<.35)?1+trait('execution')*.12:1;
 let base=Math.round(attackPower()*mult*execute*(.85+Math.random()*.32)*(crit?1.85:1));

 let burning=(weapon?.effect==='burn'||charm?.effect==='burn')&&Math.random()<.25;
 let dmg=base+(burning?Math.round(fire+hero.floor*2):0);

   if(other){let chainDmg=Math.max(2,Math.round(dmg*.48));other.hp-=chainDmg;

}
function kill(e){
 hero.kills++;let gained=9+hero.floor*3+(e.boss?70:e.elite?28:0);hero.xp+=gained;
 hero.gold+=Math.round((rand(2,8)+hero.floor*2+(e.boss?100:0))*(1+gearStat('gold')));
 floating.push({x:e.x,y:e.y,text:'+'+gained+' XP',color:'#9ff0b6',t:1.5});emitParticles(e.x,e.y,e.boss?'#ec7644':e.elite?'#be7ad0':'#d5c39a',16,.85);
 if(hero.kills===1||Math.random()<(e.boss?.99:e.elite?.79:.35))lootDrop(e.x,e.y,e.boss);
 else if(Math.random()<.07)hero.potions++;
 while(hero.xp>=xpRequired()){
   hero.xp-=xpRequired();hero.level++;hero.points++;hero.health=maxHp();hero.mana=maxMp();
   show('✦ LEVEL UP! Level '+hero.level+' · +1 skill point',2800)
 }
 game.enemies=game.enemies.filter(a=>a.hp>0);
 if(game.enemies.length===0){game.cleared=true;show('CRYPT CLEARED! Take the portal deeper',2200)}

}
function attack(){if(!hero||!game||$('veil').classList.contains('open'))return;
 let now=performance.now()/1000;if(now<(hero.nextAtk||0))return;
 hero.nextAtk=now+(hero.kind==='Ranger'?.40:hero.kind==='Mage'?.60:.52)*(1-attackHaste());
 let e=nearest(specs[hero.kind].range,true);game.swings.push({x:game.player.x,y:game.player.y,t:.19,range:specs[hero.kind].range});if(e)hitEnemy(e);
}
function special(){if(!hero||!game||$('veil').classList.contains('open'))return;let now=performance.now()/1000;if(now<(hero.nextSkill||0)){show('Skill recharging',700);return}if(hero.mana<20){show('Not enough mana',750);return}hero.nextSkill=now+5;hero.mana-=20;let hits=0;for(let e of [...game.enemies])if(dist(e,game.player)<(hero.kind==='Warrior'?2.15:4)&&visibleBetween(game.player,e)){hitEnemy(e,1.55);hits++}game.swings.push({x:game.player.x,y:game.player.y,t:.5,range:hero.kind==='Warrior'?2.15:4,special:true});if(!hits)show('No targets in range',800);updateHud();}
function potion(){if(!hero||!game)return;if(hero.potions<=0){show('No potions left',800);return}if(hero.health>=maxHp()&&hero.mana>=maxMp()){show('Already at full strength',800);return}hero.potions--;hero.health=clamp(hero.health+maxHp()*.55,0,maxHp());hero.mana=clamp(hero.mana+maxMp()*.35,0,maxMp());show('🧪 Restored health and mana');updateHud();store()}
function descend(){if(!game?.cleared)return;hero.floor++;hero.best=Math.max(hero.best,hero.floor);hero.health=Math.min(maxHp(),hero.health+maxHp()*.32);hero.mana=maxMp();hero.potions++;createFloor();store();show('DESCENDED TO FLOOR '+hero.floor)}
function pickup(){for(let d of [...game.drops]){if(dist(d,game.player)<.85){
 if(hero.bag.length>=60){if(d.item.rarity==='common'||d.item.rarity==='magic'){hero.gold+=itemWorth(d.item);show('Bag full · sold '+d.item.name)}else{show('Bag full · sell unwanted items',1800);continue}}
 else{hero.bag.push(d.item);show('Looted '+d.item.name,1600)}

}}}
function update(dt){if(!hero||!game||$('veil').classList.contains('open'))return;game.time+=dt;let p=game.player,sx=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),sy=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let x=sx/tw+sy/th,y=sy/th-sx/tw,mag=Math.hypot(x,y);if(mag>0){x/=mag;y/=mag;move(p,x*specs[hero.kind].speed,y*specs[hero.kind].speed,dt);tapTarget=null}else if(hero.auto){let near=nearest(2.25),drop=game.drops.find(d=>dist(d,p)<8);if(drop&&!near)navigate(drop,3,dt,.35);else{let target=nearest(25);if(target){let d=dist(target,p),desired=specs[hero.kind].range*.7;if(d>desired||!visibleBetween(p,target))navigate(target,specs[hero.kind].speed,dt,desired)}else if(game.drops.length)navigate(game.drops[0],2.8,dt,.35);else if(game.cleared)navigate(game.port,2.8,dt,.35)}attack()}
 else if(tapTarget){let d=dist(p,tapTarget);if(d>.18)navigate(tapTarget,specs[hero.kind].speed,dt,.18);else tapTarget=null}

function drawAtmosphere(){
 ctx.save();ctx.globalCompositeOperation='screen';
 for(let i=0;i<24;i++){
  let bx=noise(i,3,hero.floor)*CW,by=(noise(i,7,hero.floor)*CH+game.time*(3+noise(i,5)*8))%(CH+30)-15;
  let op=.05+.12*noise(i,10),r=.6+noise(i,33)*1.5;
  ctx.fillStyle=`rgba(233,177,106,${op})`;ctx.fillRect(bx,by,r,r);
 }
 for(let q of emberParticles){let f=1-q.age/q.life;if(f<=0)continue;let p=iso(q.x,q.y);ctx.fillStyle=q.color;ctx.globalAlpha=f*.95;ctx.shadowColor=q.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x+(q.dx*q.age),p.y-q.z+q.dy*q.age+(q.age*q.age*35),Math.max(.1,q.r*f),0,7);ctx.fill();}

 for(let a of actors){if(a.w)wallTile(a.w.x,a.w.y);else if(a.hero)drawEntity(a.x,a.y,'hero',null,0,1.32);else if(a.e){let e=a.e;if(!game.fog[Math.floor(e.y)]?.[Math.floor(e.x)])continue;let p=drawEntity(e.x,e.y,'mob',e.type,e.phase,e.boss?1.30:1.12,e.elite,!!(e.hitTime>0));if(e.hp<e.maxhp||e.boss||e.elite){let width=e.boss?40:e.elite?33:24;ctx.fillStyle='#3e2426';ctx.fillRect(p.x-width/2,p.y-(e.boss?71:42),width,4);ctx.fillStyle=e.elite?'#be84ee':e.boss?'#b76dd6':'#e6766d';ctx.fillRect(p.x-width/2,p.y-(e.boss?71:42),width*e.hp/e.maxhp,4)}}else if(a.d){drawRelicBeacon(a.d)}}
